plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.skipad'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.skipad"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 刻意不添加任何第三方依赖：没有广告 SDK、没有统计 SDK、没有网络库
dependencies {
}
